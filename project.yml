name: Snipcast
options:
  bundleIdPrefix: com.tangentlabs
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.3.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 4T3PRTK36U
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Snipcast:
    type: application
    platform: macOS
    sources:
      - path: Snipcast
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Snipcast/Info.plist
      properties:
        CFBundleDisplayName: Snipcast
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 Tangent Labs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tangentlabs.snipcast
        PRODUCT_NAME: Snipcast
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SnipcastTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SnipcastTests
    dependencies:
      - target: Snipcast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Snipcast:
    build:
      targets:
        Snipcast: all
        SnipcastTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnipcastTests
